services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: shift-happens-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shift_happens
    ports:
      - '5433:5432'
    volumes:
      - shift-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d shift_happens']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: shift-happens-redis
    ports:
      - '6379:6379'
    command: ['redis-server', '--appendonly', 'yes']

volumes:
  shift-pgdata:
