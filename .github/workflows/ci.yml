name: CI

on:
  push:
    branches: [main, wave0, 'wave0/**', 'wave0-*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, migrations, tests, web build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shift_happens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d shift_happens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/shift_happens?schema=public
      NEXT_TELEMETRY_DISABLED: '1'

    defaults:
      run:
        working-directory: shift-happens

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: shift-happens/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @shift-happens/db generate

      - name: Validate Prisma schema
        run: pnpm --filter @shift-happens/db exec prisma validate

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Verify seed guard refuses without SEED_DEMO=1
        run: bash scripts/check-seed-guard.sh

      - name: Typecheck
        run: pnpm typecheck

      - name: API tests (Postgres)
        run: pnpm --filter @shift-happens/api test

      - name: Web build
        run: pnpm --filter @shift-happens/web build
